<style data-page-node-id="h2frx2NLcj8P02PQ4Os9h2" data-pnid-children="IBPWSOOdEaNxzkj5muxw5Y">
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --border:#e5e9f0; --text:#1f2937; --muted:#6b7280;
    --primary:#3b82f6; --primary-dark:#2563eb; --ok:#16a34a; --warn:#dc2626;
    --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:#ffffff;color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;
         display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .logo .dot{width:32px;height:32px;border-radius:9px;
             display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  .logo small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  #search{flex:1;min-width:180px;max-width:420px;padding:8px 14px;border:1px solid var(--border);
          border-radius:8px;font-size:14px;background:var(--bg);outline:none}
  #search:focus{border-color:var(--primary)}
  .badge{font-size:12px;color:var(--ok);background:#f0fdf4;border:1px solid #bbf7d0;
         padding:3px 10px;border-radius:99px;white-space:nowrap}
  .wrap{display:flex;flex:1;min-height:0}
  nav{width:230px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;
      overflow-y:auto;flex-shrink:0}
  .cat{font-size:15px;color:var(--text);letter-spacing:.5px;
       margin:16px 10px 6px;font-weight:700}
  nav .cat:first-child{margin-top:0}
  .tool-btn{display:block;width:100%;text-align:left;padding:7px 12px;border:none;background:none;
            border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;margin:1px 0;
            box-shadow:none;font-weight:400}
  .tool-btn:hover{background:var(--bg)}
  .tool-btn.active{background:#eff6ff;color:var(--primary-dark);font-weight:600}
  main{flex:1;padding:16px 20px;overflow-y:auto;width:100%}
  h1{font-size:22px;margin-bottom:4px}
  .desc{color:var(--muted);font-size:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
        padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  textarea,input[type=text],input[type=number],input[type=datetime-local],select{
        width:100%;padding:10px 12px;border:1px solid var(--border);
        border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--text)}
  textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Consolas,monospace;line-height:1.5}
  textarea:focus,input:focus{border-color:var(--primary)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
  /* 全站按钮统一风格：蓝紫渐变实色 + 白字 */
  button{display:inline-flex;align-items:center;justify-content:center;line-height:1.2;
         padding:7px 16px;border:none;border-radius:8px;font-size:13px;cursor:pointer;
         background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:500;
         transition:filter .15s,transform .05s;box-shadow:0 2px 6px rgba(59,130,246,.25);white-space:nowrap}
  button:hover{filter:brightness(1.1)}
  button:active{filter:brightness(.95);transform:translateY(1px)}
  button.ghost{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none}
  /* 勾选框/单选框全局垂直居中对齐 */
  input[type=checkbox],input[type=radio]{vertical-align:middle;margin:0;accent-color:#3b82f6;flex-shrink:0}
  label{vertical-align:middle}
  pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:13px;
      font-family:ui-monospace,Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6}
  pre.light{background:#f1f5f9;color:#1f2937}
  .msg{font-size:13px;margin-top:8px}
  .err{color:var(--warn)} .ok{color:var(--ok)}
  /* 字段标题 label 默认块级；含输入控件的 label 自动转为行内居中（不影响勾选框） */
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
  label:has(>input),label:has(>select),label:has(>textarea),label:has(>button){
    display:inline-flex;align-items:center;margin-bottom:0;white-space:nowrap}
  .kv{display:flex;gap:10px;flex-wrap:wrap}
  .kv>div{flex:1;min-width:200px}
  .diff-add{background:#dcfce7;color:#14532d} .diff-del{background:#fee2e2;color:#7f1d1d;text-decoration:line-through}
  .diff-line{padding:2px 8px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:13px;margin:2px 0;white-space:pre-wrap}
  .match{background:#fde68a;border-radius:3px}
  .qr-out{display:flex;justify-content:center;padding:10px;min-height:180px}
  .tpl{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:#fafbfc}
  .tpl h4{font-size:14px;margin-bottom:6px}
  .tpl p{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-bottom:8px}
  .chip{display:inline-block;font-size:12px;background:#eff6ff;color:var(--primary-dark);
        padding:2px 8px;border-radius:99px;margin-right:6px}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px}
  /* JSON 双栏编辑器 */
  .jsplit{display:flex;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--border);
          border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .jpane{flex:1;display:flex;flex-direction:column;min-width:0}

  const EMPTY_HTML = '<span style="color:#9ca3af">格式化结果将显示在这里\n\n支持：错误提示定位 · 语法高亮着色 · 压缩/TS 接口 · 复制/下载</span>';
  $("j-out").innerHTML = EMPTY_HTML;

  let lastText = "";
  // 可折叠 JSON 树渲染
  function jval(v){
    if(v===null) return '<span class="jb">null</span>';
    if(typeof v==="string") return `<span class="js">"${esc(v)}"</span>`;
    if(typeof v==="number") return `<span class="jn">${v}</span>`;
    if(typeof v==="boolean") return `<span class="jb">${v}</span>`;
    const isArr = Array.isArray(v);
    const entries = isArr ? v.map((x,i)=>[i,x]) : Object.entries(v);
    const open = isArr?"[":"{", close = isArr?"]":"}";
    if(!entries.length) return `<span class="jp">${open}${close}</span>`;
    const inner = entries.map(([k,val])=>
      `<div class="jline">` +
      (isArr ? "" : `<span class="jk">"${esc(k)}"</span><span class="jp">: </span>`) +
      jval(val) + `</div>`).join("");
    return `<span class="jobj"><span class="jtog">−</span><span class="jp">${open}</span>` +
      `<span class="jcnt">${entries.length} 项</span><span class="jch">${inner}</span><span class="jp">${close}</span></span>`;
  }
  window.jshowTree = obj=>{
    lastText = JSON.stringify(obj, null, 2);
    if($("j-in").value.length > 300000){
      $("j-out").textContent = lastText;   // 超大 JSON 退化为纯文本，保证性能
    } else {
      $("j-out").innerHTML = jval(obj);
    }
  };
  window.jplain = text=>{ lastText = text; $("j-out").textContent = text; };
  // 折叠开关（事件委托）
  $("j-out").addEventListener("click", e=>{
    if(e.target.classList.contains("jtog")){
      const obj = e.target.parentElement;
      obj.classList.toggle("collapsed");
      e.target.textContent = obj.classList.contains("collapsed") ? "+" : "−";
    }
  });

  window.doFormat = (mode)=>{
    const raw = $("j-in").value;
    const msg = $("j-msg");
    if(!raw.trim()){ msg.innerHTML=""; $("j-out").innerHTML = EMPTY_HTML; lastText=""; return true; }
    let ind = 2;
    try{
      const o = JSON.parse(raw);
      const text = mode==="min" ? JSON.stringify(o) : JSON.stringify(o,null,ind);
      if(mode==="min"){
        jplain(text);                       // 压缩模式：直接显示一行式 JSON
        msg.innerHTML = `<span class="ok">✓ 已压缩为一行</span>`;
      } else {
        jshowTree(o);
        msg.innerHTML = `<span class="ok">✓ JSON 合法</span>`;
      }
      return true;
    }catch(e){
      let pos = "";
      const m = e.message.match(/position (\d+)/);
      if(m){
        const upto = raw.slice(0, +m[1]);
        const line = upto.split("\n").length;
        const col = +m[1] - upto.lastIndexOf("\n");
        pos = `（第 ${line} 行，第 ${col} 列附近）`;
      }
      msg.innerHTML = `<span class="err">✗ ${esc(e.message)} ${pos}</span>`;
      $("j-out").innerHTML = EMPTY_HTML;   // 报错时清空右侧旧内容
      lastText = "";
      return false;
    }
  };
  window.jfmt = ()=>doFormat("fmt");
  window.jmin = ()=>doFormat("min");
  window.jcheck = ()=>{
    const raw = $("j-in").value;
    if(!raw.trim()){ $("j-msg").innerHTML=""; return; }
    try{ JSON.parse(raw); $("j-msg").innerHTML='<span class="ok">✓ JSON 合法</span>'; }
    catch(e){ doFormat("fmt"); }
  };
  window.jclear = ()=>{ $("j-in").value=""; $("j-out").innerHTML=EMPTY_HTML; $("j-msg").innerHTML=""; lastText=""; jcount(); };
  window.jsample = ()=>{
    $("j-in").value = JSON.stringify({name:"开发工具箱",tags:["fast","local","free"],
      config:{debug:false,maxRetries:3},users:[{id:1,name:"张三",role:"admin"},{id:2,name:"李四",role:"user"}]},null,2);
    jcount(); jfmt();
  };
  window.jcopy = btn=>{
    navigator.clipboard.writeText(lastText || $("j-out").textContent).then(()=>{
      const old = btn.textContent; btn.textContent = "✓ 已复制";
      setTimeout(()=>btn.textContent=old, 1500);
      toast("已添加到剪贴板");
    });
  };
  window.jts = ()=>{
    try{
      const o = JSON.parse($("j-in").value);
      const text = genTs(o,"Root");
      jplain(text); $("j-msg").innerHTML = '<span class="ok">✓ 已生成 TypeScript 接口</span>';
    }catch(e){ doFormat("fmt"); }
  };
  window.jdownload = ()=>{
    const text = lastText || $("j-out").textContent;
    if(!text.trim()) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text],{type:"application/json"}));
    a.download = "formatted.json"; a.click(); URL.revokeObjectURL(a.href);
  };
  window.jcount = ()=>{ $("j-count").textContent = $("j-in").value.length + " 字符"; };
  let timer = null;
  $("j-in").addEventListener("input", ()=>{
    jcount();
    clearTimeout(timer);
    timer = setTimeout(()=>doFormat("fmt"), 400);
  });
  jsample();
};
function genTs(obj, name){
  const tsType = v=>{
    if(v===null) return "null";
    if(Array.isArray(v)) return "any[]";
    if(typeof v==="object") return name;
    return typeof v==="number"?"number": typeof v==="boolean"?"boolean":"string";
  };
  if(Array.isArray(obj)) return genTs(obj[0]||{}, name);
  let out = `interface ${name} {\n`;
  for(const [k,v] of Object.entries(obj)){
    if(v!==null && typeof v==="object" && !Array.isArray(v)){
      const sub = k.charAt(0).toUpperCase()+k.slice(1);
      out += `  ${k}: ${sub};\n` + genTs(v, sub) + "\n";
    } else out += `  ${k}: ${tsType(v)};\n`;
  }
  return out + "}";
}

/* --- XML 格式化 --- */
RENDER.xml = el=>{
  el.innerHTML = `
  <div class="card"><label>输入 XML</label>
    <textarea id="x-in" style="min-height:160px" placeholder="<root><item id=&quot;1&quot;>内容</item></root>"></textarea>
    <div class="row">
      <button onclick="xmlFmt(1)">格式化（Tab）</button>
      <button onclick="xmlMin()">压缩</button>
      <button class="ghost" onclick="xmlCheck()">校验</button>
    </div><div class="msg" id="x-msg"></div></div>
  <div class="card"><label>结果（高亮）</label><pre class="light" id="x-out" style="max-height:480px;min-height:160px"></pre>
    <div class="row"><button class="ghost" onclick="copyFrom('x-out',this)">复制</button></div></div>`;
  const $ = id=>document.getElementById(id);
  // 词法切分：注释 / CDATA / 处理指令 / 开闭标签 / 文本
  const tokenize = src=>{
    const tokens = [];
    const re = /<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<!DOCTYPE[\s\S]*?>|<\/[^>]+>|<[^>]+>/g;
    let last = 0, m;
    while((m = re.exec(src))){
      if(m.index > last){
        const txt = src.slice(last, m.index);
        if(txt.trim()) tokens.push({t:"text", v:txt});
      }
      const v = m[0];
      let t = "tag";
      if(v.startsWith("<!--")) t = "comment";
      else if(v.startsWith("<![CDATA[")) t = "cdata";
      tokens.push({t, v});
      last = m.index + v.length;
    }
    if(last < src.length && src.slice(last).trim()) tokens.push({t:"text", v:src.slice(last)});
    return tokens;
  };
  const fmt = (src, ind, unit)=>{
    const tokens = tokenize(src);
    let depth = 0, out = [];
    for(let i=0;i<tokens.length;i++){
      const tk = tokens[i];
      if(tk.t === "text"){
        const txt = tk.v.trim();
        if(txt) out.push(unit.repeat(depth) + txt);
        continue;
      }
      const v = tk.v;
      if(v.startsWith("</")){
        depth = Math.max(0, depth-1);
        out.push(unit.repeat(depth) + v);
      } else if(v.startsWith("<?") || v.startsWith("<!") || tk.t==="comment" || tk.t==="cdata"){
        out.push(unit.repeat(depth) + v);
      } else if(v.endsWith("/>")){
        out.push(unit.repeat(depth) + v);
      } else {
        out.push(unit.repeat(depth) + v);
        // 自闭合检测：<tag ...> 后面紧跟 </tag> 且中间只有空白 → 合并为一行
        const next = tokens[i+1], nn = tokens[i+2];
        if(next && next.t==="text" && !next.v.trim() && nn && nn.t==="tag" && nn.v.startsWith("</")){
          const closeName = nn.v.slice(2, -1).trim();
          const openName = (v.slice(1).match(/^[\w:.-]+/)||[""])[0];
          if(closeName === openName){
            out[out.length-1] = unit.repeat(depth) + v + nn.v;
            i += 2;
            continue;
          }
        }
        // 简单元素：<tag>纯文本</tag> → 内容与标签同行
        if(next && next.t==="text" && next.v.trim() && nn && nn.t==="tag" && nn.v.startsWith("</")){
          const closeName = nn.v.slice(2, -1).trim();
          const openName = (v.slice(1).match(/^[\w:.-]+/)||[""])[0];
          if(closeName === openName){
            out[out.length-1] = unit.repeat(depth) + v + next.v.trim() + nn.v;
            i += 2;
            continue;
          }
        }
        depth++;
      }
    }
    return out.join("\n");
  };
  // 高亮：标签蓝、属性名橙红、属性值绿、注释灰、文本深灰
  // 注意顺序：先处理属性、注释等纯文本阶段，最后注入标签名 span，
  // 避免后面的正则把已注入的 style="..." 再当成 XML 属性二次加工
  const highlight = s=>{
    return esc(s)
      .replace(/([\w:.-]+)=(&quot;|")((?:(?!\2).)*)\2/g, '<span style="color:#953800">$1</span>=<span style="color:#116329">$2$3$2</span>')
      .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span style="color:#6b7280">$1</span>')
      .replace(/(&lt;\/?)([\w:.-]+)/g, '$1<span style="color:#0550ae;font-weight:600">$2</span>')
      .replace(/(&lt;!\[CDATA\[|&lt;\?|&lt;!DOCTYPE)/g, '<span style="color:#8250df">$1</span>');
  };
  const validate = raw=>{
    try{
      const doc = new DOMParser().parseFromString(raw, "application/xml");
      const err = doc.querySelector("parsererror");
      if(err){
        const m = err.textContent.match(/line[\s\S]*?(\d+)/i);
        return {ok:false, msg:`✗ XML 有误：${(err.textContent.split("\n").find(l=>l.trim())||"").slice(0,160)}${m?`（第 ${m[1]} 行附近）`:""}`};
      }
      return {ok:true, msg:"✓ XML 格式合法"};
    }catch(e){ return {ok:false, msg:`✗ ${esc(e.message)}`}; }
  };
  window.xmlFmt = ind=>{
    const raw = $("x-in").value;
    if(!raw.trim()){ $("x-msg").innerHTML=""; return; }
    const v = validate(raw);
    $("x-msg").innerHTML = v.ok ? `<span class="ok">${v.msg}</span>` : `<span class="err">${v.msg}</span>`;
    if(!v.ok) return;
    const unit = ind===1 ? "\t" : " ".repeat(ind);
    $("x-out").innerHTML = highlight(fmt(raw, 0, unit));
  };
  window.xmlMin = ()=>{
    const raw = $("x-in").value;
    if(!raw.trim()) return;
    const v = validate(raw);
    $("x-msg").innerHTML = v.ok ? `<span class="ok">${v.msg}</span>` : `<span class="err">${v.msg}</span>`;
    if(!v.ok) return;
    // 压缩：标签间空白移除，文本内容保留原样
    const min = raw.replace(/>\s+</g, "><").replace(/(<!--[\s\S]*?-->)\s+/g, "$1").trim();
    $("x-out").innerHTML = highlight(min);
  };
  window.xmlCheck = ()=>{
    const raw = $("x-in").value;
    if(!raw.trim()){ $("x-msg").innerHTML=""; return; }
    const v = validate(raw);
    $("x-msg").innerHTML = v.ok ? `<span class="ok">${v.msg}</span>` : `<span class="err">${v.msg}</span>`;
    if(!v.ok) return;
    $("x-out").innerHTML = highlight(fmt(raw, 0, "  "));
  };
};

      $("api-body-form").style.display = (v==="form-data"||v==="urlencoded") ? "flex" : "none";
      $("api-body-file").style.display = v==="binary" ? "" : "none";
      $("api-body-gql").style.display = v==="graphql" ? "flex" : "none";
      if(v==="raw" && $("api-raw-type").value==="json" && !$("api-body-raw").value.trim()) $("api-body-raw").value = '{\n  "key": "value"\n}';
    });
  });
  $("api-raw-type").addEventListener("change", ()=>{
    if($("api-raw-type").value==="json" && !$("api-body-raw").value.trim()) $("api-body-raw").value = '{\n  "key": "value"\n}';
  });
  // 复制 cURL 命令：终端 / Postman 不受浏览器 CORS 限制，可用来验证服务本身是否正常
  window.apiCurl = ()=>{
    let url = $("api-url").value.trim();
    if(!url){ toast("请输入请求 URL"); return; }
    url = url.replace(/[\u200b-\u200f\u2028\u2029\u202a-\u202e\ufeff\u00a0\u3000]/g, "")
             .replace(/[\uff01-\uff5e]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xfee0))
             .replace(/\s+/g, "");
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    const qs = readKv("api-qs");
    if(Object.keys(qs).length){
      try{
        const u = new URL(url, location.href);
        Object.entries(qs).forEach(([k,v])=>u.searchParams.set(k,v));
        url = u.toString();
      }catch(e){}
    }
    const method = $("api-method").value;
    const headers = readKv("api-hdrs");
    const btype = document.querySelector('input[name="api-btype"]:checked').value;
    const sh = s=>"'"+String(s).replace(/'/g,"'\\''")+"'";
    const hasCT = Object.keys(headers).some(k=>k.toLowerCase()==="content-type");
    const parts = [`curl -X ${method}`];
    let body = null;
    if(method!=="GET" && method!=="HEAD" && btype!=="none"){
      if(btype==="raw"){
        body = $("api-body-raw").value;
        if(!hasCT) parts.push(`-H 'Content-Type: ${rawTypes[$("api-raw-type").value]}'`);
      } else if(btype==="urlencoded"){
        const fd=[];
        Object.entries(readKv("api-formkv")).forEach(([k,v])=>fd.push(encodeURIComponent(k)+"="+encodeURIComponent(v)));
        body = fd.join("&");
        if(!hasCT) parts.push(`-H 'Content-Type: application/x-www-form-urlencoded'`);
      } else if(btype==="form-data"){
        Object.entries(readKv("api-formkv")).forEach(([k,v])=>parts.push(`-F ${sh(k+"="+v)}`));
      } else if(btype==="binary"){
        const f = $("api-file").files[0];
        if(f) parts.push(`--data-binary @${sh(f.name)}`);
      } else if(btype==="graphql"){
        let vars = {};
        const vs = $("api-gql-vars").value.trim();
        if(vs){ try{ vars = JSON.parse(vs); }catch(e){} }
        body = JSON.stringify({ query:$("api-gql-query").value.trim(), variables:vars });
        if(!hasCT) parts.push(`-H 'Content-Type: application/json'`);
      }
    }
    Object.entries(headers).forEach(([k,v])=>parts.push(`-H ${sh(k+": "+v)}`));
    if(body!=null) parts.push(`-d ${sh(body)}`);
    parts.push(sh(url));
    navigator.clipboard.writeText(parts.join(" "))
      .then(()=>toast("cURL 命令已复制，可在终端或 Postman 中直接执行"), ()=>toast("复制失败，请手动复制"));
  };
  window.apiSend = async ()=>{
    const btn = $("api-send-btn"), meta = $("api-meta");
    let url = $("api-url").value.trim();
    if(!url){ meta.innerHTML = '<span class="err">请输入请求 URL</span>'; return; }
    // 清洗 URL：去零宽/不可见字符、全角转半角、去除内部空白（粘贴常带入这些字符，会导致 Failed to parse URL）
    url = url.replace(/[\u200b-\u200f\u2028\u2029\u202a-\u202e\ufeff\u00a0\u3000]/g, "")
             .replace(/[\uff01-\uff5e]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xfee0))
             .replace(/\s+/g, "");
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    // 仅支持 HTTPS：HTTPS 页面请求 HTTP 会被浏览器混合内容拦截，提前拦截并说明
    if(location.protocol === "https:" && /^http:\/\//i.test(url)){
      meta.innerHTML = `<span class="err">✗ 本工具仅支持 HTTPS 接口</span><br>
        <span style="font-size:13px;color:var(--muted)">你输入的是 HTTP 地址 <code>${esc(url)}</code>。浏览器安全策略禁止 HTTPS 页面请求 HTTP 接口（混合内容拦截），网页端无法绕过。<br>
        替代方案：① 让后端接口支持 HTTPS 并加 CORS 头；② 点「复制 cURL」在终端 / Postman 中测试（不受浏览器限制）。</span>`;
      return;
    }
    // 预校验 URL 合法性，给出明确中文提示
    try{ new URL(url); }
    catch(e){
      meta.innerHTML = `<span class="err">✗ URL 格式不正确：${esc(url)}</span><br><span style="color:var(--muted);font-size:13px">请检查地址是否完整、是否混入了空格、换行或全角字符（如 ： ． ／ 全角数字）。</span>`;
      return;
    }
    // 拼 Query 参数
    const qs = readKv("api-qs");
    if(Object.keys(qs).length){
      const u = new URL(url, location.href);
      Object.entries(qs).forEach(([k,v])=>u.searchParams.set(k,v));
      url = u.toString();
    }
    const method = $("api-method").value;
    const headers = readKv("api-hdrs");
    const btype = document.querySelector('input[name="api-btype"]:checked').value;
    let body;
    const hasCT = ()=>Object.keys(headers).some(k=>k.toLowerCase()==="content-type");
    if(method!=="GET" && method!=="HEAD" && btype!=="none"){
      if(btype==="raw"){
        const rt = $("api-raw-type").value;
        const t = $("api-body-raw").value;
        if(rt==="json"){
          try{ JSON.parse(t); }catch(e){ meta.innerHTML = `<span class="err">✗ JSON Body 不合法：${esc(e.message)}</span>`; return; }
        }
        body = t;
        if(!hasCT()) headers["Content-Type"] = rawTypes[rt];
      } else if(btype==="urlencoded"){
        const fd = [];
        Object.entries(readKv("api-formkv")).forEach(([k,v])=>fd.push(encodeURIComponent(k)+"="+encodeURIComponent(v)));
        body = fd.join("&");
        if(!hasCT()) headers["Content-Type"] = "application/x-www-form-urlencoded";
      } else if(btype==="form-data"){
        const f = new FormData();
        Object.entries(readKv("api-formkv")).forEach(([k,v])=>f.append(k,v));
        body = f;
      } else if(btype==="binary"){
        const f = $("api-file").files[0];
        if(!f){ meta.innerHTML = '<span class="err">请选择要上传的文件</span>'; return; }
        body = f;
      } else if(btype==="graphql"){
        const q = $("api-gql-query").value.trim();
        if(!q){ meta.innerHTML = '<span class="err">请填写 GraphQL Query</span>'; return; }
        let vars = {};
        const vs = $("api-gql-vars").value.trim();
        if(vs){ try{ vars = JSON.parse(vs); }catch(e){ meta.innerHTML = `<span class="err">✗ Variables JSON 不合法：${esc(e.message)}</span>`; return; } }
        body = JSON.stringify({ query:q, variables:vars });
        if(!hasCT()) headers["Content-Type"] = "application/json";
      }
    }
    btn.disabled = true; btn.textContent = "请求中…";
    meta.innerHTML = "";
    const t0 = performance.now();
    try{
      const resp = await fetch(url, { method, headers, body, mode: "cors" });
      const ms = Math.round(performance.now() - t0);
      const text = await resp.text();
      const sizeKB = (new Blob([text]).size/1024).toFixed(2);
      const cls = resp.ok ? "ok" : "err";
      meta.innerHTML = `<span class="${cls}">${resp.status} ${resp.statusText || ""}</span>　${ms} ms　${sizeKB} KB`;
      // 响应头
      let hs = "";
      resp.headers.forEach((v,k)=>{ hs += k + ": " + v + "\n"; });
      $("api-rhdrs-pre").textContent = hs || "（浏览器未暴露任何响应头，可能被 CORS 限制）";
      // 响应体
      let out = text, parsed = null;
      try{ parsed = JSON.parse(text); }catch(e){}
      if(parsed !== null && $("api-pretty").checked){
        out = JSON.stringify(parsed, null, 2);
      }
      $("api-rbody-pre").textContent = out || "（空响应体）";
      $("api-res-empty").style.display = "none";
      $("api-res").style.display = "flex";
      $("api-rbody-pre").style.background = resp.ok ? undefined : "#fef2f2";
    }catch(e){
      // 失败诊断：https 页面请求 http 目标 → 混合内容拦截；再用 no-cors 探测区分"网络不通"与"CORS 拦截"
      let diag = "";
      const pageHttps = location.protocol === "https:";
      const targetHttp = /^http:\/\//i.test(url);
      if(pageHttps && targetHttp){
        diag = `<span class="err">⛔ 本工具仅支持 HTTPS 接口</span>：当前页面是 HTTPS，浏览器禁止请求 HTTP 地址 <code>${esc(url)}</code>（混合内容拦截）。请改用 HTTPS 接口，或点「复制 cURL」在终端 / Postman 中测试。`;
      } else {
        let reach = null;
        try{ await fetch(url, { method: "HEAD", mode: "no-cors", signal: AbortSignal.timeout(5000) }); reach = true; }
        catch(ex2){ reach = false; }
        if(reach){
          diag = `<span style="color:#d97706">⚠️ 服务器可达，但被 CORS 拦截</span>：目标服务没有返回跨域许可（Access-Control-Allow-Origin），浏览器禁止网页读取响应。
            <br><span style="color:var(--muted)">解决办法：让服务端为该接口加上 CORS 响应头（如 <code>Access-Control-Allow-Origin: *</code>）；纯浏览器工具无法绕过此限制。</span>`;
        } else {
          diag = `<span class="err">⛔ 无法连接到目标服务器</span>：网络不可达、IP/端口错误、服务未启动或被防火墙拦截。
            <br><span style="color:var(--muted)">注意：网页工具运行在浏览器里，只能访问你本机可达的地址；如果目标是局域网地址，请在同一局域网的电脑上打开本页面再测。</span>`;
        }
      }
      const msgZh = /parse URL/i.test(e.message) ? "URL 无法解析，请检查地址是否混入了空格、换行或全角字符" : e.message;
      meta.innerHTML = `<span class="err">✗ 请求失败：${esc(msgZh)}</span><br><span style="font-size:13px">${diag}</span>`;
      $("api-res-empty").style.display = "none";
      $("api-res").style.display = "flex";
      $("api-rbody-pre").textContent = "";
      $("api-rhdrs-pre").textContent = "";
    }finally{
      btn.disabled = false; btn.textContent = "发送";
    }
  };
  $("api-url").addEventListener("keydown", e=>{ if(e.key==="Enter") apiSend(); });
  // 预置一行示例
  apiAddKv("api-hdrs","Header 名称","Header 值");
};

    const dp = Array.from({length:n+1},()=>new Uint32Array(m+1));
    for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
      dp[i][j] = normTok(ta[i])===normTok(tb[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
    const markedA = new Array(n).fill(false), markedB = new Array(m).fill(false);
    let i=0,j=0;
    while(i<n && j<m){
      if(normTok(ta[i])===normTok(tb[j])){ i++; j++; }
      else if(dp[i+1][j] >= dp[i][j+1]) markedA[i++]=true;
      else markedB[j++]=true;
    }
    while(i<n) markedA[i++]=true;
    while(j<m) markedB[j++]=true;
    const build = (toks,marked,cls)=>{
      let html="";
      toks.forEach((t,k)=>{
        if(/^\s+$/.test(t)) html += esc(t);
        else html += marked[k] ? '<span class="'+cls+'">'+esc(t)+'</span>' : esc(t);
      });
      return html;
    };
    return [build(ta,markedA,"wd"), build(tb,markedB,"wa")];
  }

  // 光标离开（或导入文件/切换选项）时对比：只做行染色，不改动任何原文
  let lastKey = null;
  function doCompare(){
    const aVal=$("d-a").value, bVal=$("d-b").value;
    const ns=$("d-nospace").checked, nc=$("d-nocase").checked;
    const key = aVal+"\u0000"+bVal+"\u0000"+ns+nc;
    if(key===lastKey) return;
    lastKey = key;
    tintsA={}; tintsB={}; wordA={}; wordB={};
    const msg=$("d-msg");
    if(!aVal.trim() && !bVal.trim()){
      renderAll();
      msg.textContent="在两侧输入或粘贴文本，自动实时对比"; return;
    }
    const aLines=aVal.replace(/\r/g,"").split("\n");
    const bLines=bVal.replace(/\r/g,"").split("\n");
    const n=aLines.length, m=bLines.length;
    // 归一化结果缓存：全程只算一次
    const normA=aLines.map(l=>norm(l,ns,nc)), normB=bLines.map(l=>norm(l,ns,nc));
    // 先裁掉首尾完全相同的部分（大文件只有小段变化时，DP 规模骤降）
    let pre=0; while(pre<n&&pre<m&&normA[pre]===normB[pre])pre++;
    let suf=0; while(suf<n-pre&&suf<m-pre&&normA[n-1-suf]===normB[m-1-suf])suf++;
    const an=n-pre-suf, bm=m-pre-suf;
    const ops=[];
    for(let k=0;k<pre;k++)ops.push(["=",k,k]);
    if(an*bm<=4000000){
      // 中段 LCS：一维扁平 DP（避免百万级 Uint32Array 分配）
      const W=bm+1;
      const dp=new Uint32Array((an+1)*W);
      for(let i=an-1;i>=0;i--)for(let j=bm-1;j>=0;j--)
        dp[i*W+j]=normA[pre+i]===normB[pre+j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
      let i=0,j=0;
      while(i<an&&j<bm){
        if(normA[pre+i]===normB[pre+j]){ops.push(["=",pre+i,pre+j]);i++;j++;}
        else if(dp[(i+1)*W+j]>=dp[i*W+j+1])ops.push(["-",pre+i++,-1]);
        else ops.push(["+",-1,pre+j++]);
      }
      while(i<an)ops.push(["-",pre+i++,-1]);
      while(j<bm)ops.push(["+",-1,pre+j++]);
    } else {
      // 中段过大（如两份完全不同的超大文件）：跳过精确配对，整体标记
      for(let k=0;k<an;k++)ops.push(["-",pre+k,-1]);
      for(let k=0;k<bm;k++)ops.push(["+",-1,pre+k]);
    }
    for(let k=0;k<suf;k++)ops.push(["=",n-suf+k,m-suf+k]);
    const blocks=[];
    ops.forEach(op=>{const last=blocks[blocks.length-1];
      if(last&&last.type===op[0])last.ops.push(op);else blocks.push({type:op[0],ops:[op]});});
    // 相邻的删除块与新增块合并为一个变更块，才能做「修改行配对 + 词级高亮」
    const merged=[];
    blocks.forEach(bl=>{
      const last=merged[merged.length-1];
      if(last&&last.type!=="="&&bl.type!=="=") last.ops=last.ops.concat(bl.ops);
      else merged.push({type:bl.type,ops:bl.ops.slice()});
    });
    let mod=0,del=0,add=0;
    merged.forEach(bl=>{
      if(bl.type==="=")return;
      const dels=bl.ops.filter(o=>o[0]==="-"),adds=bl.ops.filter(o=>o[0]==="+");
      const len=Math.max(dels.length,adds.length);
      for(let k=0;k<len;k++){
        const d=dels[k],a2=adds[k];
        if(d!=null&&a2!=null){
          if(normA[d[1]]===normB[a2[2]])continue; // 配对后内容相同：不染色
          mod++;
          const[wa,wb]=wordDiff(aLines[d[1]],bLines[a2[2]],ns,nc);
          tintsA[d[1]]="del";tintsB[a2[2]]="add";
          wordA[d[1]]=wa;wordB[a2[2]]=wb;
        }else if(d!=null){del++;tintsA[d[1]]="del";}
        else{add++;tintsB[a2[2]]="add";}
      }
    });
    renderAll();
    msg.innerHTML=((mod+del+add)===0?'<span class="ok">✓ 两段文本完全相同</span>':
      '<span style="color:var(--muted)">对比完成：</span><b>'+mod+'</b> 行修改 · <span style="color:#dc2626">'+del+'</span> 行删除 · <span style="color:#2563eb">'+add+'</span> 行新增')
      +'　<span style="color:#cbd5e1">| 直接修改文本，输入即自动重新对比</span>';
  }

  // 输入：立即渲染平文（文字始终可见），随后自动对比 —— 粘贴后立即对比，打字防抖 300ms
  let rafId=null, cmpTimer=null;
  function onInput(immediate){
    tintsA=null;tintsB=null;wordA=null;wordB=null;lastKey=null;
    if(!rafId) rafId=requestAnimationFrame(()=>{rafId=null;renderAll();});
    clearTimeout(cmpTimer);
    cmpTimer=setTimeout(doCompare, immediate ? 20 : 300);
  }
  const bindInput = id=>{
    const ta=$(id);
    ta.addEventListener("input", ()=>onInput(false));
    ta.addEventListener("paste", ()=>onInput(true));   // 粘贴 → 立刻对比
    ta.addEventListener("cut",   ()=>onInput(true));
    ta.addEventListener("drop",  ()=>onInput(true));
  };
  bindInput("d-a"); bindInput("d-b");
  // 光标离开 → 也对比一次（兜底，确保最终状态正确）
  $("d-a").addEventListener("focusout",doCompare);
  $("d-b").addEventListener("focusout",doCompare);
  $("d-nospace").addEventListener("change",doCompare);
  $("d-nocase").addEventListener("change",doCompare);
  // 滚动同步：textarea ↔ 高亮层，A ↔ B
  let locking=false;
  function bindScroll(taId,hlId,otherTaId,otherHlId){
    const ta=$(taId),hl=$(hlId);
    ta.addEventListener("scroll",()=>{
      if(locking)return;locking=true;
      hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;
      const o=$(otherTaId),oh=$(otherHlId);
      o.scrollTop=ta.scrollTop;
      oh.scrollTop=o.scrollTop;oh.scrollLeft=o.scrollLeft;
      locking=false;
    });
  }
  bindScroll("d-a","d-hl-a","d-b","d-hl-b");
  bindScroll("d-b","d-hl-b","d-a","d-hl-a");
  renderAll();
  // 高度自适应
  const fitWrap=()=>{const w=document.getElementById("d-wrap");if(!w)return;
    w.style.height=Math.max(480,window.innerHeight-w.getBoundingClientRect().top-14)+"px";};
  fitWrap();
  window.addEventListener("resize",fitWrap);
};

RENDER.b64img = el=>{

            <rect x="3" y="3" width="18" height="18" rx="3"/>

        </div>
      </div>
      <div id="b642img" style="display:none;text-align:left">
        <label>粘贴 Base64 或 Data URI</label>
        <textarea id="b64-img-in" style="min-height:110px;font-size:12px" placeholder="data:image/png;base64,iVBORw0KGgo=… 也可以只贴 base64 主体"></textarea>
        <div class="row" style="justify-content:center;margin-top:8px">
          <button onclick="showB64Img()">转换为图片</button>
          <button class="ghost" onclick="dlB64Img()">下载图片</button>
          <button class="" onclick="clearB2I()">清除</button>
        </div>
        <div class="msg" id="b2i-msg"></div>
        <div id="b2i-preview" style="display:none;text-align:center;margin-top:8px">
          <img id="b2i-img" style="max-width:100%;max-height:260px;border:1px solid var(--border);border-radius:8px">
        </div>
      </div>
    </div>`;
  window.imgMode = m=>{
    document.getElementById("img2b64").style.display = m==="i2b" ? "" : "none";
    document.getElementById("b642img").style.display = m==="b2i" ? "" : "none";
    document.getElementById("img2b64-side").classList.toggle("active", m==="i2b");
    document.getElementById("b642img-side").classList.toggle("active", m==="b2i");
  };
  // 图片 → Base64
  const fileInput = document.getElementById("img-file");
  fileInput.addEventListener("change", e=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const uri = reader.result;
      document.getElementById("img-prev-el").src = uri;
      document.getElementById("img-preview").style.display = "";
      document.getElementById("img-b64-out").value = uri;
      const kb = (f.size/1024).toFixed(1);
      document.getElementById("img-info").textContent = `${f.name} · ${kb} KB · ${f.type||"未知类型"} · Base64 长度 ${uri.length}`;
    };
    reader.readAsDataURL(f);
  });
  fileInput.closest(".upload-box").addEventListener("dragover", e=>{ e.preventDefault(); e.currentTarget.style.borderColor="var(--primary)"; });
  fileInput.closest(".upload-box").addEventListener("dragleave", e=>{ e.currentTarget.style.borderColor="var(--border)"; });
  fileInput.closest(".upload-box").addEventListener("drop", e=>{
    e.preventDefault(); e.currentTarget.style.borderColor="var(--border)";
    const f = e.dataTransfer.files[0];
    if(f && f.type.startsWith("image/")){
      try{ const dt = new DataTransfer(); dt.items.add(f); fileInput.files = dt.files; fileInput.dispatchEvent(new Event("change")); }
      catch(ex){ // 兜底：直接读取
        const r = new FileReader(); r.onload = ()=>{ document.getElementById("img-prev-el").src=r.result;
          document.getElementById("img-preview").style.display="";
          document.getElementById("img-b64-out").value=r.result;
          document.getElementById("img-info").textContent=`${f.name} · ${(f.size/1024).toFixed(1)} KB`; };
        r.readAsDataURL(f);
      }
    }
  });
  window.dlImg = ()=>{
    const uri = document.getElementById("img-b64-out").value;
    if(!uri) return;
    const a = document.createElement("a");
    a.href = uri; a.download = (document.getElementById("img-info").textContent.split(" · ")[0] || "image") + "-copy";
    a.click();
  };
  window.clearI2B = ()=>{
    document.getElementById("img-b64-out").value = "";
    document.getElementById("img-preview").style.display = "none";
    document.getElementById("img-file").value = "";
  };
  // Base64 → 图片
  window.showB64Img = ()=>{
    const msg = document.getElementById("b2i-msg"), prev = document.getElementById("b2i-preview");
    let v = document.getElementById("b64-img-in").value.trim().replace(/\s+/g,"");
    if(!v){ msg.innerHTML = '<span class="err">请先粘贴 Base64 内容</span>'; prev.style.display="none"; return; }
    let mime = "";
    const m = v.match(/^data:(image\/[\w+.-]+);base64,/i);
    if(m){ mime = m[1]; }
    else {
      // 无前缀时按 base64 头猜测常见格式
      if(v.startsWith("iVBOR")) mime = "image/png";
      else if(v.startsWith("/9j/")) mime = "image/jpeg";
      else if(v.startsWith("R0lGO")) mime = "image/gif";
      else if(v.startsWith("UklGR")) mime = "image/webp";
      else if(v.startsWith("PHN2Z")) mime = "image/svg+xml";
      else { msg.innerHTML = '<span class="err">✗ 无法识别图片格式（请确认是图片的 Base64）</span>'; prev.style.display="none"; return; }
      v = `data:${mime};base64,` + v;
    }
    const img = document.getElementById("b2i-img");
    img.onload = ()=>{
      prev.style.display = "";
      msg.innerHTML = `<span class="ok">✓ ${mime} · ${img.naturalWidth}×${img.naturalHeight}px</span>`;
      window._b2iUri = v;
    };
    img.onerror = ()=>{
      prev.style.display = "none";
      msg.innerHTML = '<span class="err">✗ 解码失败：Base64 内容不是有效图片</span>';
      window._b2iUri = null;
    };
    img.src = v;
  };
  window.dlB64Img = ()=>{
    if(!window._b2iUri){ document.getElementById("b2i-msg").innerHTML = '<span class="err">请先转换出图片</span>'; return; }
    const ext = (window._b2iUri.match(/^data:image\/([\w+.-]+);/)||[,"png"])[1].replace("svg+xml","svg").replace("jpeg","jpg");
    const a = document.createElement("a");
    a.href = window._b2iUri; a.download = "image." + ext; a.click();
  };
  window.clearB2I = ()=>{
    document.getElementById("b64-img-in").value = "";
    document.getElementById("b2i-preview").style.display = "none";
    document.getElementById("b2i-msg").innerHTML = "";
    window._b2iUri = null;
  };
};

RENDER.hash = el=>{

  };
};

  <div class="card"><label>输入文本</label><textarea id="tk-in" style="min-height:180px"></textarea>
    <div class="msg" id="tk-out">（输入后自动估算）</div>
    <div class="msg" style="color:var(--muted)">估算规则（近似值）：汉字约 1 token/字；英文约 0.75 token/单词；其余字符每 4 个约 1 token。仅供参考。</div></div>`;
  const run = ()=>{
    const t = document.getElementById("tk-in").value;
    if(!t){ document.getElementById("tk-out").innerHTML="（输入后自动估算）"; return; }
    const han = (t.match(/[\u4e00-\u9fff]/g)||[]).length;
    const en  = (t.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).length;
    const other = t.length - han - (t.match(/[A-Za-z]/g)||[]).length;
    const est = Math.ceil(han*1 + en*0.75 + other/4);
    document.getElementById("tk-out").innerHTML =
      `<span class="ok">估算 Token：<b style="font-size:18px">${est}</b>　（字符 ${t.length} · 汉字 ${han} · 英文词 ${en}）</span>`;
  };
  document.getElementById("tk-in").addEventListener("input", run);
};

    {name:"报错诊断", text:"我遇到如下报错，请分析最可能的原因，并给出排查步骤和修复方案。环境：（语言/框架/版本）\n\n报错信息：\n（粘贴报错）"},
    {name:"翻译润色", text:"请把下面的内容翻译成英文，要求保留技术术语的准确性，语气自然专业，并附一个更口语化的版本。\n\n（粘贴内容）"},
  ];
  el.innerHTML = templates.map((t,i)=>`
    <div class="tpl"><h4>${t.name}</h4><p>${esc(t.text)}</p>
    <button class="ghost" onclick="copyTpl(${i},this)">复制模板</button></div>`).join("")
    + `<textarea id="tpl-store" style="display:none">${templates.map(t=>esc(t.text)).join("\n%%SEP%%\n")}</textarea>`;
  window.copyTpl = (i,btn)=>{
    const raw = document.getElementById("tpl-store").value.split("\n%%SEP%%\n")[i];
    navigator.clipboard.writeText(raw.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")).then(()=>{
      const old=btn.textContent; btn.textContent="✓ 已复制"; setTimeout(()=>btn.textContent=old,1500);
    });
  };
};

RENDER.qr = el=>{

    <div class="row" style="flex-wrap:nowrap"><input type="text" id="qr-in" placeholder="https://example.com">
    <button onclick="makeQr()" style="white-space:nowrap">生成二维码</button></div>

  <div class="card"><div class="qr-out" id="qr-box"></div>

      document.getElementById("qr-msg").innerHTML='<span class="err">二维码库加载失败（需联网加载一次）</span>'; return;

/* --- 图片压缩 --- */
RENDER.img = el=>{
  el.innerHTML = `
  <div class="card">
    <div class="row"><input type="file" id="im-file" accept="image/*"></div>
    <div class="kv">
      <div><label>压缩质量：<span id="im-q-v">0.7</span></label><input type="range" id="im-q" min="0.1" max="0.95" step="0.05" value="0.7"></div>
      <div><label>最大宽度（px，0=保持）</label><input type="number" id="im-w" value="0" min="0"></div>
    </div>
    <div class="row"><button onclick="doCompress()">压缩</button><span class="msg" id="im-msg"></span></div>
  </div>
  <div class="card"><label>预览</label><div style="text-align:center"><img id="im-prev" style="max-width:100%;max-height:320px;border-radius:8px" hidden></div>
    <div class="row" style="justify-content:center"><button class="ghost" id="im-dl" style="display:none">下载压缩图</button></div></div>`;
  document.getElementById("im-q").addEventListener("input",e=>document.getElementById("im-q-v").textContent=e.target.value);
  let srcData = null, outData = null;
  document.getElementById("im-file").addEventListener("change", e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ srcData = r.result; const p=document.getElementById("im-prev"); p.src=srcData; p.hidden=false; document.getElementById("im-msg").textContent=`原始大小：${(f.size/1024).toFixed(1)} KB`; };
    r.readAsDataURL(f);
  });
  window.doCompress = ()=>{
    if(!srcData){ document.getElementById("im-msg").innerHTML='<span class="err">请先选择图片</span>'; return; }
    const img = new Image();
    img.onload = ()=>{
      const q = +document.getElementById("im-q").value;
      const maxW = +document.getElementById("im-w").value || img.width;
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      outData = c.toDataURL("image/jpeg", q);
      const p = document.getElementById("im-prev"); p.src = outData; p.hidden = false;
      const kb = (outData.length*0.75/1024).toFixed(1);
      document.getElementById("im-msg").innerHTML = `<span class="ok">压缩完成：约 ${kb} KB（${c.width}×${c.height}）</span>`;
      const dl = document.getElementById("im-dl"); dl.style.display="inline-block";
      dl.onclick = ()=>{ const a=document.createElement("a"); a.href=outData; a.download="compressed.jpg"; a.click(); };
    };
    img.src = srcData;
  };
};

/* --- 颜色转换 --- */
RENDER.color = el=>{
  el.innerHTML = `
  <div class="card"><div class="kv">
    <div><label>HEX</label><input type="text" id="c-hex" value="#3B82F6" placeholder="#RRGGBB"></div>
    <div><label>RGB</label><input type="text" id="c-rgb" value="rgb(59, 130, 246)" placeholder="r, g, b"></div>
    <div><label>HSL</label><input type="text" id="c-hsl" placeholder="h, s%, l%"></div>
  </div>
  <div class="row"><span class="swatch" id="c-swatch"></span><span class="msg" id="c-msg"></span></div></div>`;
  const hex2rgb = h=>{ h=h.replace("#",""); if(h.length===3) h=[...h].map(c=>c+c).join("");
    const n=parseInt(h,16); return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255]; };
  const rgb2hsl = ([r,g,b])=>{
    r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
    if(mx===mn) return [0,0,l];
    const d=mx-mn, s=l>0.5? d/(2-mx-mn) : d/(mx+mn);
    const h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? (b-r)/d+2 : (r-g)/d+4;
    return [Math.round(h*60), Math.round(s*100), Math.round(l*100)];
  };
  const hsl2rgb = ([h,s,l])=>{
    s/=100; l/=100;
    const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
    const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return [f(0),f(8),f(4)].map(v=>Math.round(v*255));
  };
  const paint = (rgb, ok, note)=>{
    const sw = document.getElementById("c-swatch"), msg = document.getElementById("c-msg");
    if(!ok){ msg.innerHTML=`<span class="err">${note}</span>`; return; }
    sw.style.background = `rgb(${rgb.join(",")})`;
    document.getElementById("c-rgb").value = `rgb(${rgb.join(", ")})`;
    document.getElementById("c-hsl").value = `hsl(${rgb2hsl(rgb).join(", ")}%)`;
    document.getElementById("c-hex").value = "#"+rgb.map(v=>v.toString(16).padStart(2,"0").toUpperCase()).join("");
    msg.innerHTML = "";
  };
  document.getElementById("c-hex").addEventListener("input", e=>{
    const rgb = hex2rgb(e.target.value.trim());
    paint(rgb, !!rgb, "HEX 格式不正确");
  });
  document.getElementById("c-rgb").addEventListener("input", e=>{
    const m = e.target.value.match(/(\d+)\D+(\d+)\D+(\d+)/);
    if(!m){ return; }
    const rgb = [+m[1],+m[2],+m[3]];
    paint(rgb, rgb.every(v=>v<=255), "RGB 值需在 0~255");
  });
  document.getElementById("c-hsl").addEventListener("input", e=>{
    const m = e.target.value.match(/(\d+)\D+(\d+)\D+(\d+)/);
    if(!m){ return; }
    paint(hsl2rgb([+m[1],+m[2],+m[3]]), true, "");
  });
  paint([59,130,246], true);
};
